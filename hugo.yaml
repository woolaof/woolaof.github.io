baseURL: 'https://woolaof.github.io/'
locale: 'zh-cn'
title: 'woolaof'
theme: 'PaperMod'

outputs:
  home:
    - HTML
    - RSS
    - JSON

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true
paginate: 8

params:
  env: 'production'
  title: 'woolaof'
  description: '记录折腾、学习与思考'
  author: 'woolaof'
  keywords: ['博客', '开发', '学习', '折腾']

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: '沃米 WoolaofUmi'

  socialIcons:
    - name: 'github'
      url: 'https://github.com/woolaof'
    - name: 'rss'
      url: 'index.xml'

menu:
  main:
    - identifier: search
      name: 搜索
      url: /search/
      weight: 5
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: links
      name: 友链
      url: /links/
      weight: 25
    - identifier: about
      name: 关于
      url: /about/
      weight: 30
