baseURL: 'https://woolaof.github.io/'
locale: 'zh-cn'
title: 'woolaof'
theme: 'PaperMod'

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true
paginate: 8

params:
  env: 'production'
  title: 'woolaof'
  description: '记录折腾、学习与思考'
  author: 'woolaof'
  keywords: ['博客', '开发', '学习', '折腾']

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: '你好，我是沃米'
    Content: >
      一个爱折腾的高中生 / 开发爱好者。
      这里记录我的学习、项目与思考。

  socialIcons:
    - name: 'github'
      url: 'https://github.com/woolaof'
    - name: 'rss'
      url: 'index.xml'

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: about
      name: 关于
      url: /about/
      weight: 30
